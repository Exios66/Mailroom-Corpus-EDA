<g opacity=".92"><rect x="24" y="946" width="592" height="82" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="962" width="5" height="50" rx="2" fill="#38bdf8"/><text x="54" y="980" font-size="17" fill="#e2e8f0" font-weight="700">30 PNGs</text><text x="54" y="1002" font-size="14" fill="#94a3b8">reports/figures/</text><text x="54" y="1020" font-size="12" fill="#64748b">static figures</text></g>
<g opacity=".92"><rect x="24" y="1036" width="592" height="82" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="1052" width="5" height="50" rx="2" fill="#38bdf8"/><text x="54" y="1070" font-size="17" fill="#e2e8f0" font-weight="700">18 HTML</text><text x="54" y="1092" font-size="14" fill="#94a3b8">figures_interactive/</text><text x="54" y="1110" font-size="12" fill="#64748b">Plotly, per-render UUIDs</text></g>
<g opacity=".92"><rect x="24" y="1126" width="592" height="82" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="1142" width="5" height="50" rx="2" fill="#38bdf8"/><text x="54" y="1160" font-size="17" fill="#e2e8f0" font-weight="700">Tables</text><text x="54" y="1182" font-size="14" fill="#94a3b8">reports/tables/</text><text x="54" y="1200" font-size="12" fill="#64748b">CSV + JSON</text></g>
<g opacity=".92"><rect x="24" y="1216" width="592" height="82" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="1232" width="5" height="50" rx="2" fill="#38bdf8"/><text x="54" y="1250" font-size="17" fill="#e2e8f0" font-weight="700">Dataset cards</text><text x="54" y="1272" font-size="14" fill="#94a3b8">docs/dataset-cards/</text><text x="54" y="1290" font-size="12" fill="#64748b">sources + licenses</text></g>
</svg>
