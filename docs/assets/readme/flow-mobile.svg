<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1326" width="640" height="1326" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="t">Seven phases, one command</title>
  <desc id="d">Seven analysis phases, P0 to P6, from fetching the pinned corpus to the correspondence intent audit, and the reports they leave under reports/.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#151036"/><stop offset="1" stop-color="#22103a"/></linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a78bfa" stop-opacity=".9"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>@media (prefers-reduced-motion: reduce){.motion{display:none}}</style>
  <rect width="640" height="1326" rx="24" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="639" height="1325" rx="24" fill="none" stroke="#1f2a44"/>

<text x="24" y="40" font-size="12" fill="#8b9bb4" font-weight="700" letter-spacing="2">SEVEN PHASES, ONE COMMAND</text>
<path id="chain" d="M320 111.0 V759.0" fill="none"/>
<rect x="24" y="70" width="592" height="82" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="86" width="5" height="50" rx="2" fill="#38bdf8"/><text x="54" y="104" font-size="18" fill="#e2e8f0" font-weight="700">P0 Fetch</text><text x="54" y="126" font-size="14" fill="#94a3b8">pinned corpus</text><text x="54" y="144" font-size="12" fill="#64748b">manifest check</text>
<path d="M320 155 L320 175" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="24" y="178" width="592" height="82" rx="14" fill="#0f172a" stroke="#22c55e" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="194" width="5" height="50" rx="2" fill="#22c55e"/><text x="54" y="212" font-size="18" fill="#e2e8f0" font-weight="700">P1 Audit</text><text x="54" y="234" font-size="14" fill="#94a3b8">integrity</text><text x="54" y="252" font-size="12" fill="#64748b">provenance</text>
<path d="M320 263 L320 283" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="24" y="286" width="592" height="82" rx="14" fill="#0f172a" stroke="#a3e635" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="302" width="5" height="50" rx="2" fill="#a3e635"/><text x="54" y="320" font-size="18" fill="#e2e8f0" font-weight="700">P2 Strata</text><text x="54" y="342" font-size="14" fill="#94a3b8">composition</text><text x="54" y="360" font-size="12" fill="#64748b">imbalance</text>
<path d="M320 371 L320 391" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="24" y="394" width="592" height="82" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="410" width="5" height="50" rx="2" fill="#a78bfa"/><text x="54" y="428" font-size="18" fill="#e2e8f0" font-weight="700">P3 Figures</text><text x="54" y="450" font-size="14" fill="#94a3b8">static PNGs</text><text x="54" y="468" font-size="12" fill="#64748b">EDA tables</text>
<path d="M320 479 L320 499" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="24" y="502" width="592" height="82" rx="14" fill="#0f172a" stroke="#fb923c" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="518" width="5" height="50" rx="2" fill="#fb923c"/><text x="54" y="536" font-size="18" fill="#e2e8f0" font-weight="700">P4 Plotly</text><text x="54" y="558" font-size="14" fill="#94a3b8">interactive</text><text x="54" y="576" font-size="12" fill="#64748b">HTML figures</text>
<path d="M320 587 L320 607" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="24" y="610" width="592" height="82" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="626" width="5" height="50" rx="2" fill="#f472b6"/><text x="54" y="644" font-size="18" fill="#e2e8f0" font-weight="700">P5 Stage</text><text x="54" y="666" font-size="14" fill="#94a3b8">cast-safe JSONL</text><text x="54" y="684" font-size="12" fill="#64748b">+ parquet</text>
<path d="M320 695 L320 715" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="24" y="718" width="592" height="82" rx="14" fill="#0f172a" stroke="#facc15" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="734" width="5" height="50" rx="2" fill="#facc15"/><text x="54" y="752" font-size="18" fill="#e2e8f0" font-weight="700">P6 Intent</text><text x="54" y="774" font-size="14" fill="#94a3b8">correspondence</text><text x="54" y="792" font-size="12" fill="#64748b">coverage audit</text>
<circle class="motion" r="5" fill="#7dd3fc" filter="url(#soft)"><animateMotion dur="6.3s" begin="0s" repeatCount="indefinite"><mpath href="#chain"/></animateMotion></circle>
<text x="24" y="840" font-size="12" fill="#8b9bb4" font-weight="700" letter-spacing="2">WHAT LANDS IN REPORTS/ AND DOCS/</text>
