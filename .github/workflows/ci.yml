name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff==0.17.4"
      - name: Undefined names and invalid syntax (whole tree)
        run: ruff check --select E9,F63,F7,F82 src tests scripts run_all.py
      - name: Byte-compile every module
        run: python -m compileall -q src scripts tests

  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest "openpyxl==3.1.5"
      - name: Pin the sibling taxonomy checkout
        run: |
          git init ../llm-mailroom
          git -C ../llm-mailroom remote add origin https://github.com/Exios66/llm-mailroom.git
          git -C ../llm-mailroom fetch --depth 1 origin 9e8f30b279e7626c056b03511f823105760f80d7
          git -C ../llm-mailroom checkout --force --detach FETCH_HEAD
      - name: Full offline suite
        run: python -m pytest tests/ -q
      - name: Dependency consistency
        run: python -m pip check

  browser:
    name: real browser suites
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Python and axe-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm install --prefix .cache/axe --no-save axe-core
      - name: Chrome is present
        run: google-chrome --version
      - name: Synthetic integrated page smoke
        env:
          CHROME: google-chrome
          CHROME_NO_SANDBOX: "1"
          AXE_PATH: .cache/axe/node_modules/axe-core/axe.min.js
        run: node tests/browser_review_page.mjs "$GITHUB_WORKSPACE/.cache/browser-evidence/synthetic"
      - name: Real portal end to end
        env:
          CHROME: google-chrome
          CHROME_NO_SANDBOX: "1"
          AXE_PATH: .cache/axe/node_modules/axe-core/axe.min.js
          PYTHON: python
        run: node tests/browser_review_portal.mjs "$GITHUB_WORKSPACE/.cache/browser-evidence/real"
      - name: Upload browser evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: .cache/browser-evidence
          if-no-files-found: ignore
