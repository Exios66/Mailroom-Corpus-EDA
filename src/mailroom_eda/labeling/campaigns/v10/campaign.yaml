  - {id: "3",  task: intent, set: calibration, models: [openai/gpt-6-luna-pro], reasoning: "off", skip: "2026-11-06 run: κ 0.543, clearly the weakest intent arm", cap_usd: 0.00,
     gate: {kind: intent_kappa, kappa: 0.75}, note: "arm 4: GPT-6 Luna Pro"}
  - {id: "3",  task: intent, set: calibration, models: [anthropic/claude-haiku-5.5], reasoning: "off", cap_usd: 0.10,
     gate: {kind: intent_kappa, kappa: 0.75}, note: "arm 5: Claude Haiku 5.5"}
  - {id: "3",  task: intent, set: calibration, models: [minimax/minimax-m3.1-flash], reasoning: "low", cap_usd: 0.15,
