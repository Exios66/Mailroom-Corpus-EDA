# v10 label-completion campaign: the chunk sequence a human runs one by one.
#
# Each chunk is `python -m mailroom_eda.labeling run --task <task> --set <set>
# [--chunk <chunk>] --provider openrouter --model <models[0]> [--second-model <models[1]>]
# --reasoning <reasoning> --initials <YOURS> --api-cost-cap-usd <cap_usd>
# --max-wall-seconds <max_wall_seconds> --out docs/reports/audits/v10_labels`.
# A chunk starts only after the previous chunk's gate passed and a human signed it off
# in runbook.md. `costs.md` is generated from this file (`labeling costs`).
#
# gate kinds:
#   cuad_f1         micro-F1 / precision against the expert CUAD spans (v9_4_revision)
#   intent_kappa    Cohen's kappa against the manual intent labels
#   field_accuracy  per-field accuracy against gold derived from the expert CUAD spans
#   human_verdicts  share of `fields.csv` rows a reviewer marked correct
#   agreement       two-model agreement, verbatim evidence; disagreements go to adjudication
#   review          a human reads the chunk CSVs and signs off
name: v10
max_wall_seconds: 5400
chunks:
  - {id: "1",  task: cuad, set: calibration, models: [z-ai/glm-5.3-flashx-legal], reasoning: "off", cap_usd: 0.75,
     gate: {kind: cuad_f1, micro_f1: 0.75, precision: 0.80}, note: "bake-off arm 1"}
  - {id: "1",  task: cuad, set: calibration, models: [z-ai/glm-5.3-flashx-legal], reasoning: "low", cap_usd: 0.85,
     gate: {kind: cuad_f1, micro_f1: 0.75, precision: 0.80}, note: "bake-off arm 2; adopt only if micro-F1 >= arm 1 + 0.02"}
  - {id: "1",  task: cuad, set: calibration, models: [deepseek/deepseek-v4.1-flash], reasoning: "off", cap_usd: 0.40,
     gate: {kind: cuad_f1, micro_f1: 0.75, precision: 0.80}, note: "bake-off arm 3"}
  - {id: "2a", task: cuad, set: pending, chunk: "1/3", models: [winner_of_1], reasoning: winner_of_1, cap_usd: 0.60, gate: {kind: review}}
  - {id: "2b", task: cuad, set: pending, chunk: "2/3", models: [winner_of_1], reasoning: winner_of_1, cap_usd: 0.60, gate: {kind: review}}
  - {id: "2c", task: cuad, set: pending, chunk: "3/3", models: [winner_of_1], reasoning: winner_of_1, cap_usd: 0.60, gate: {kind: review}}
  - {id: "3",  task: intent, set: calibration, models: [deepseek/deepseek-v4.1-flash], reasoning: "off", cap_usd: 0.15,
     gate: {kind: intent_kappa, kappa: 0.75}}
  - {id: "3",  task: intent, set: calibration, models: [deepseek/deepseek-v4.1-flash], reasoning: "low", cap_usd: 0.20,
     gate: {kind: intent_kappa, kappa: 0.75}}
  - {id: "4",  task: intent, set: flagged, models: [deepseek/deepseek-v4.1-flash], reasoning: winner_of_3, cap_usd: 0.10, gate: {kind: review}}
  - {id: "5a", task: contract_entities, set: calibration, models: [z-ai/glm-5.3-flashx-legal, deepseek/deepseek-v4.1-flash],
     reasoning: "off", cap_usd: 0.75, gate: {kind: field_accuracy, accuracy: 0.85}, requires: "llm-dojo-scoring 0.28.0 (G1)"}
  - {id: "5b", task: contract_entities, set: pilot, models: [z-ai/glm-5.3-flashx-legal, deepseek/deepseek-v4.1-flash],
     reasoning: "off", cap_usd: 1.00, gate: {kind: human_verdicts, precision: 0.90}}
  - {id: "5c", task: contract_entities, set: remainder, chunk: "1/3", models: [z-ai/glm-5.3-flashx-legal, deepseek/deepseek-v4.1-flash],
     reasoning: "off", cap_usd: 3.00, gate: {kind: agreement}}
  - {id: "5d", task: contract_entities, set: remainder, chunk: "2/3", models: [z-ai/glm-5.3-flashx-legal, deepseek/deepseek-v4.1-flash],
     reasoning: "off", cap_usd: 3.00, gate: {kind: agreement}}
  - {id: "5e", task: contract_entities, set: remainder, chunk: "3/3", models: [z-ai/glm-5.3-flashx-legal, deepseek/deepseek-v4.1-flash],
     reasoning: "off", cap_usd: 3.00, gate: {kind: agreement}}
  - {id: "6a", task: merger_entities, set: pilot, models: [z-ai/glm-5.3-flashx-legal, deepseek/deepseek-v4.1-flash],
     reasoning: "off", cap_usd: 0.40, gate: {kind: human_verdicts, precision: 0.90}, requires: "llm-dojo-scoring 0.28.0 (G1)"}
  - {id: "6b", task: merger_entities, set: remainder, chunk: "1/2", models: [z-ai/glm-5.3-flashx-legal, deepseek/deepseek-v4.1-flash],
     reasoning: "off", cap_usd: 1.50, gate: {kind: agreement}}
  - {id: "6c", task: merger_entities, set: remainder, chunk: "2/2", models: [z-ai/glm-5.3-flashx-legal, deepseek/deepseek-v4.1-flash],
     reasoning: "off", cap_usd: 1.50, gate: {kind: agreement}}
  - {id: "7a", task: correspondence, set: pilot, models: [deepseek/deepseek-v4.1-flash, minimax/minimax-m3.1-flash],
     reasoning: "off", cap_usd: 0.25, gate: {kind: human_verdicts, precision: 0.90}}
  - {id: "7b", task: correspondence, set: remainder, chunk: "1/4", models: [deepseek/deepseek-v4.1-flash, minimax/minimax-m3.1-flash], reasoning: "off", cap_usd: 0.35, gate: {kind: agreement}}
  - {id: "7c", task: correspondence, set: remainder, chunk: "2/4", models: [deepseek/deepseek-v4.1-flash, minimax/minimax-m3.1-flash], reasoning: "off", cap_usd: 0.35, gate: {kind: agreement}}
  - {id: "7d", task: correspondence, set: remainder, chunk: "3/4", models: [deepseek/deepseek-v4.1-flash, minimax/minimax-m3.1-flash], reasoning: "off", cap_usd: 0.35, gate: {kind: agreement}}
  - {id: "7e", task: correspondence, set: remainder, chunk: "4/4", models: [deepseek/deepseek-v4.1-flash, minimax/minimax-m3.1-flash], reasoning: "off", cap_usd: 0.35, gate: {kind: agreement}}
  - {id: "8a", task: claim_checklist, set: pilot, models: [deepseek/deepseek-v4.1-flash, minimax/minimax-m3.1-flash],
     reasoning: "off", cap_usd: 0.25, gate: {kind: human_verdicts, precision: 0.90}}
  - {id: "8b", task: claim_checklist, set: remainder, chunk: "1/4", models: [deepseek/deepseek-v4.1-flash, minimax/minimax-m3.1-flash], reasoning: "off", cap_usd: 0.40, gate: {kind: agreement}}
  - {id: "8c", task: claim_checklist, set: remainder, chunk: "2/4", models: [deepseek/deepseek-v4.1-flash, minimax/minimax-m3.1-flash], reasoning: "off", cap_usd: 0.40, gate: {kind: agreement}}
  - {id: "8d", task: claim_checklist, set: remainder, chunk: "3/4", models: [deepseek/deepseek-v4.1-flash, minimax/minimax-m3.1-flash], reasoning: "off", cap_usd: 0.40, gate: {kind: agreement}}
  - {id: "8e", task: claim_checklist, set: remainder, chunk: "4/4", models: [deepseek/deepseek-v4.1-flash, minimax/minimax-m3.1-flash], reasoning: "off", cap_usd: 0.50, gate: {kind: agreement}}
  - {id: "9a", task: corporate, set: pilot, models: [z-ai/glm-5.3-flashx-legal, deepseek/deepseek-v4.1-flash],
     reasoning: "off", cap_usd: 0.50, gate: {kind: human_verdicts, precision: 0.90}}
  - {id: "9b", task: corporate, set: remainder, chunk: "1/4", models: [z-ai/glm-5.3-flashx-legal, deepseek/deepseek-v4.1-flash], reasoning: "off", cap_usd: 1.00, gate: {kind: agreement}}
  - {id: "9c", task: corporate, set: remainder, chunk: "2/4", models: [z-ai/glm-5.3-flashx-legal, deepseek/deepseek-v4.1-flash], reasoning: "off", cap_usd: 1.00, gate: {kind: agreement}}
  - {id: "9d", task: corporate, set: remainder, chunk: "3/4", models: [z-ai/glm-5.3-flashx-legal, deepseek/deepseek-v4.1-flash], reasoning: "off", cap_usd: 1.00, gate: {kind: agreement}}
  - {id: "9e", task: corporate, set: remainder, chunk: "4/4", models: [z-ai/glm-5.3-flashx-legal, deepseek/deepseek-v4.1-flash], reasoning: "off", cap_usd: 1.00, gate: {kind: agreement}}
