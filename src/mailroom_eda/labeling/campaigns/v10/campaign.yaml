# Steps after labeling make no model calls, so they are not chunks: costs.md, ping and
# `labeling sweep` ignore them. `labeling gate <id> --approve` records them like a chunk.
#   resolved        no approved chunk has a field still at final_decision adjudicate
#                   (`labeling adjudicate` lists them in adjudication/open.csv)
steps:
  - {id: "10", task: adjudication, set: all, needs: ["1", "1h", "2a", "2b", "2c", "3", "4a", "4b", "4c", "5a", "5b", "5c", "5d", "5e", "6c0", "6c1", "6a", "6b", "6c", "7a", "7b", "7c", "7d", "7e", "8a", "8b", "8c", "8d", "8e", "9a", "9b", "9c", "9d", "9e"],
     gate: {kind: resolved}}
# The sandbox interim overlay the flag-only cross-check reads (labeling/interim.py): the
# sha256 of local-mailroom-sandbox data/labels/interim/MANIFEST.json at sandbox_commit.
# A rebuilt overlay is refused until this pin moves.
interim_overlay: {manifest_sha256: "318045d37a6931507132cc34cfcd13fdb83cfeb0a02615d61d6c7abf24d41720",
                  sandbox_commit: "55ea9d701ca468e5194c4713c40ca58effcb2b80"}

# Jev intent QA (`labeling jev calibrate|audit`, labeling/jev.py): TypeSafe's decisions model
# checks intent labels and never writes one. total_cap_usd bounds every Jev journal together;
# audit is refused until the current prompt sha calibrates at kappa_floor on the full gold.
jev:
  model: typesafe/jev-1.14
  price_per_m_input_usd: 0.042
  total_cap_usd: 0.30
  kappa_floor: 0.75
  flag_below: 0.30
