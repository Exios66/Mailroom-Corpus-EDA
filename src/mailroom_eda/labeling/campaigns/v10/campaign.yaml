# v10 label-completion campaign: the chunk sequence a human runs one by one.
#
# Each chunk is `python -m mailroom_eda.labeling run --task <task> --set <set>
# [--chunk <chunk>] --provider openrouter --model <models[0]> [--second-model <models[1]>]
# --reasoning <reasoning> --initials <YOURS> --api-cost-cap-usd <cap_usd>
# --max-wall-seconds <max_wall_seconds> --out docs/reports/audits/v10_labels`.
# The easy form is `labeling chunk <id> [--arm N] --initials <YOURS>`, which reads every
# setting below. A chunk with `needs` starts only after those chunks are approved
# (`labeling gate <id> --approve`), and a human signs each one off in runbook.md. `costs.md` is generated from this file (`labeling costs`).
#
# gate kinds:
#   cuad_f1         micro-F1 / precision against the expert CUAD spans (v9_4_revision)
#   intent_kappa    Cohen's kappa against the manual intent labels
#   field_accuracy  per-field accuracy against gold derived from the expert CUAD spans
#   consideration_accuracy  each model's merger_consideration answers against the expert
#                   MAUD Type of Consideration answer, with a confusion table
#   human_verdicts  share of `fields.csv` rows a reviewer marked correct
#   agreement       two-model agreement, verbatim evidence; disagreements go to adjudication
#   review          a human reads the chunk CSVs and signs off
name: v10
max_wall_seconds: 5400
# sha256 of data/v9_4/stage/ground_truth_hardened.jsonl the selections and costs were made
# from (`labeling stage` rebuilds it byte-identically from the public v9.2 Hub tag).
stage_sha256: eccb0acff441914865bf75d8985863d4250e3b161c4afd9d6debfde9ea77ea84
chunks:
