  # between the two v4.1 Flash snapshots, and a second opinion must score on this gold set at
  # least as well as the primary. GLM-legal (contracts/mergers candidate) and MiniMax refuse
  # reasoning off. Arm 3 keeps its number so its old-prompt journal stays attributable.
  - {id: "1",  task: cuad, set: calibration, models: [deepseek/deepseek-v4.1-flash], reasoning: "low", cap_usd: 0.30,
     gate: {kind: cuad_f1, micro_f1: 0.75, precision: 0.80}, note: "arm 1: DeepSeek v4.1 Flash, low"}
  - {id: "1",  task: cuad, set: calibration, models: [z-ai/glm-5.3-flashx-legal], reasoning: "low", cap_usd: 0.55,
     gate: {kind: cuad_f1, micro_f1: 0.75, precision: 0.80}, note: "arm 2: GLM-5.3 FlashX Legal, low"}
  - {id: "1",  task: cuad, set: calibration, models: [deepseek/deepseek-v4.1-flash], reasoning: "off", cap_usd: 0.25,
     gate: {kind: cuad_f1, micro_f1: 0.75, precision: 0.80}, note: "arm 3: DeepSeek v4.1 Flash, off"}
  - {id: "1",  task: cuad, set: calibration, models: [deepseek/deepseek-v4.1-flash-1017], reasoning: "off", cap_usd: 0.45,
     gate: {kind: cuad_f1, micro_f1: 0.75, precision: 0.80}, note: "arm 4: DeepSeek v4.1 Flash 1017 (newer snapshot), off"}
  - {id: "1",  task: cuad, set: calibration, models: [openai/gpt-6-luna-pro], reasoning: "off", cap_usd: 0.20,
     gate: {kind: cuad_f1, micro_f1: 0.75, precision: 0.80}, note: "arm 5: GPT-6 Luna Pro"}
  - {id: "1",  task: cuad, set: calibration, models: [anthropic/claude-haiku-5.5], reasoning: "off", cap_usd: 0.20,
     gate: {kind: cuad_f1, micro_f1: 0.75, precision: 0.80}, note: "arm 6: Claude Haiku 5.5"}
  - {id: "1",  task: cuad, set: calibration, models: [minimax/minimax-m3.1-flash], reasoning: "low", cap_usd: 0.30,
     gate: {kind: cuad_f1, micro_f1: 0.75, precision: 0.80}, note: "arm 7: MiniMax M3.1 Flash, low"}
  # Chunk 1h: 40 more golden contracts the prompt was never tuned on, one arm per chunk-1
