  - {id: "4", needs: ["3"],  task: intent, set: flagged, models: [winner_of_3], reasoning: winner_of_3, cap_usd: 0.00, gate: {kind: review},
     skip: "2026-11-06: superseded by 4a-4c, which re-read these 25 flagged emails with two models"}
  # Chunks 4a-4c re-read every machine-made intent (904 emails: llm_zero_shot, aeslc_join,
  # heuristic, flagged included) with the chunk 3 primary and Haiku 5.5, the user's pick for the
  # second opinion (2026-11-06: no other-vendor arm cleared the 0.05 non-inferiority bound on 96
