# Field registry for the v10 label-completion campaign.
#
# One entry per (document class, field). Types are llm-dojo-scoring scoring types.
# Fields marked `dojo: v2` are the adapted contract / merger entity schemas proposed in
# docs/plans/v10-consumer-patches.md (G1). They are labeled and published, but the
# Dojo scores them only after G1 lands. Every other field must match
# dojo_snapshot/dojo_schemas.json `default_field_types` exactly (tests/test_labeling.py),
# except where `retype` records the type change G1 makes.
#
# Every label is grounded in doc_text: scored models see only the text, so a value the
# text does not state is absent, even when row metadata knows it.
#
# source:
#   deterministic  set by v10_build from data already in the row (no model call)
#   gold           expert or human labels already in the dataset
#   llm            filled by the campaign task named in `task`
# absence:
#   absent_ok      both models agreeing on not_found -> schema_documented_absence
#   evidence_only  absence only from a quoted absence statement; otherwise unlabeled
#   never_absent   the field always has a value (e.g. urgency defaults to routine)

dojo_pin: {version: "0.27.2", commit: "1cd4aba76d82eea20c6e8dfcc0d760881bf84924"}

vocabularies:
  contract_party_role: [licensor, licensee, supplier, customer, distributor, reseller, franchisor,
                        franchisee, service_provider, client, sponsor, agent, principal, partner,
                        lender, borrower, other]
  merger_consideration: [all_cash, all_stock, mixed_cash_stock, mixed_cash_stock_election, other]
  merger_intent: [effect_merger, amend_merger, other]
  communication_type: [email, letter, memo, notice, demand, attorney_demand, press_release,
                       meeting_request, other]
  urgency: [routine, time-sensitive, urgent, critical]
  correspondence_intent: [payment_demand, notice, analysis, request, update, meeting_invite,
                          press_communication, other]
  claim_checklist_category: [Coverage Determination, Policy Limits, Exclusions Cited, Deductible,
                             Reservation Of Rights, Timely Notice, Proof Of Loss, Subrogation,
                             Independent Medical Exam, Amount Consistency]

classes:
  contract:
    specialist: contracts_specialist
    fields:
      document_name: {type: name, source: llm, task: contract_entities, absence: evidence_only}
      parties: {type: "entity_list:name", source: llm, task: contract_entities, absence: evidence_only}
      party_roles: {type: "entity_list:free_text", source: llm, task: contract_entities, absence: evidence_only, dojo: v2, vocabulary: contract_party_role, vocabulary_part: tail}
      signatories: {type: "entity_list:name", source: llm, task: contract_entities, absence: absent_ok, dojo: v2}
      agreement_date: {type: date, source: llm, task: contract_entities, absence: absent_ok, dojo: v2}
      effective_date: {type: date, source: llm, task: contract_entities, absence: absent_ok}
      expiration_date: {type: date, source: llm, task: contract_entities, absence: absent_ok, dojo: v2}
      term_length: {type: free_text, source: llm, task: contract_entities, absence: absent_ok}
      renewal_terms: {type: free_text, source: llm, task: contract_entities, absence: absent_ok}
      termination_notice_period: {type: free_text, source: llm, task: contract_entities, absence: absent_ok, dojo: v2}
      governing_law: {type: name, source: llm, task: contract_entities, absence: absent_ok, note: "the governing-law sentence, verbatim"}
      dispute_forum: {type: name, source: llm, task: contract_entities, absence: absent_ok, dojo: v2}
      contract_value: {type: money, source: llm, task: contract_entities, absence: absent_ok}
      payment_terms: {type: free_text, source: llm, task: contract_entities, absence: absent_ok, dojo: v2}
      territory: {type: free_text, source: llm, task: contract_entities, absence: absent_ok, dojo: v2}
      cuad_family: {type: name, retype: label, source: deterministic, absence: never_absent, note: "dojo CUAD family key from expected_subclass"}
      cuad_clauses: {type: "entity_list:free_text", source: gold, task: cuad, absence: never_absent, note: "expert CUAD spans; EX-10 rows by the cuad task"}
  merger_agreement:
    specialist: merger_agreement_specialist
    fields:
      document_name: {type: name, source: llm, task: merger_entities, absence: evidence_only}
      parties: {type: "entity_list:name", source: llm, task: merger_entities, absence: evidence_only}
      acquirer: {type: name, source: llm, task: merger_entities, absence: evidence_only, dojo: v2}
      target: {type: name, source: llm, task: merger_entities, absence: evidence_only, dojo: v2}
      merger_sub: {type: "entity_list:name", source: llm, task: merger_entities, absence: absent_ok, dojo: v2}
      signatories: {type: "entity_list:name", source: llm, task: merger_entities, absence: absent_ok, dojo: v2}
      effective_date: {type: date, source: llm, task: merger_entities, absence: absent_ok, note: "null when only an Effective Time is defined"}
      effective_time: {type: free_text, source: llm, task: merger_entities, absence: absent_ok}
      governing_law: {type: name, source: llm, task: merger_entities, absence: absent_ok, note: "the governing-law sentence, verbatim"}
      per_share_cash_amount: {type: money, source: llm, task: merger_entities, absence: absent_ok, dojo: v2}
      exchange_ratio: {type: free_text, source: llm, task: merger_entities, absence: absent_ok, dojo: v2}
      target_termination_fee: {type: money, source: llm, task: merger_entities, absence: absent_ok, dojo: v2}
      parent_termination_fee: {type: money, source: llm, task: merger_entities, absence: absent_ok, dojo: v2}
      outside_date: {type: date, source: llm, task: merger_entities, absence: absent_ok, dojo: v2}
      financial_advisors: {type: "entity_list:name", source: llm, task: merger_entities, absence: absent_ok, dojo: v2}
      legal_counsel: {type: "entity_list:name", source: llm, task: merger_entities, absence: absent_ok, dojo: v2}
      merger_consideration: {type: name, retype: label, source: deterministic, task: merger_consideration, absence: never_absent, vocabulary: merger_consideration, note: "the merger subclass where the expert MAUD Type of Consideration answer confirms it (95 rows); the merger_consideration task labels the 56 rows without that answer, after calibrating on the 95"}
      maud_clauses: {type: "entity_list:free_text", source: gold, absence: never_absent}
      intent: {type: name, retype: label, source: llm, task: merger_entities, absence: never_absent, vocabulary: merger_intent}
      subject_matter: {type: free_text, source: llm, task: merger_entities, absence: never_absent}
      keywords: {type: "entity_list:name", source: llm, task: merger_entities, absence: never_absent}
  correspondence:
    specialist: correspondence_specialist
    fields:
      sender: {type: name, source: llm, task: correspondence, absence: absent_ok, note: "From: header or sign-off as printed; metadata.sender_addr is a cross-check, not a label"}
      recipient: {type: name, source: llm, task: correspondence, absence: absent_ok, note: "first To: addressee or salutation name as printed"}
      additional_recipients: {type: entity_list, source: llm, task: correspondence, absence: absent_ok, note: "other To: and Cc: addressees as printed"}
      communication_type: {type: name, retype: label, source: deterministic, absence: never_absent, vocabulary: communication_type, note: "the correspondence subclass"}
      communication_date: {type: date, source: llm, task: correspondence, absence: absent_ok, note: "a date printed in the message (Date: header or Sent: line); metadata.date is a cross-check"}
      demand_amount: {type: money, source: llm, task: correspondence, absence: absent_ok}
      action_items: {type: entity_list, source: llm, task: correspondence, absence: absent_ok}
      urgency: {type: name, retype: label, source: llm, task: correspondence, absence: never_absent, vocabulary: urgency}
      intent: {type: label, source: gold, task: intent, absence: never_absent, vocabulary: correspondence_intent}
      subject_matter: {type: free_text, source: gold, absence: never_absent}
      keywords: {type: "entity_list:name", source: gold, absence: never_absent}
  insurance_claim:
    specialist: insurance_claims_specialist
    fields:
      claim_number: {type: id, source: gold, absence: never_absent}
      policy_number: {type: id, source: gold, absence: never_absent}
      insurer: {type: name, source: gold, absence: never_absent}
      insured_party: {type: name, source: gold, absence: never_absent}
      claim_type: {type: name, retype: label, source: gold, absence: never_absent}
      date_of_loss: {type: date, source: gold, absence: absent_ok}
      date_filed: {type: date, source: gold, absence: absent_ok}
      claimed_amount: {type: money, source: gold, absence: never_absent}
      adjuster: {type: name, source: gold, absence: absent_ok}
      damages_description: {type: free_text, source: gold, absence: never_absent}
      coverage_determination: {type: name, retype: label, source: gold, absence: never_absent}
      denial_reasons: {type: "entity_list:free_text", source: gold, absence: absent_ok}
      supporting_documents: {type: entity_list, source: gold, absence: absent_ok}
      intent: {type: label, source: gold, absence: never_absent}
      subject_matter: {type: free_text, source: gold, absence: never_absent}
      keywords: {type: "entity_list:name", source: gold, absence: never_absent}
      claim_checklist: {type: "entity_list:free_text", source: llm, task: claim_checklist, absence: absent_ok, vocabulary: claim_checklist_category, vocabulary_part: head}
  corporate_record:
    specialist: corporate_records_specialist
    # Core fields; subclass entity keys come from dojo_snapshot corporate_subclass_schemas,
    # all with source llm, task corporate, absence absent_ok.
    fields:
      entity_name: {type: name, source: gold, task: corporate, absence: evidence_only}
      record_type: {type: name, source: gold, absence: never_absent}
      effective_date: {type: date, source: llm, task: corporate, absence: absent_ok}
      signatories: {type: "entity_list:name", source: llm, task: corporate, absence: absent_ok}
      jurisdiction: {type: name, source: llm, task: corporate, absence: absent_ok}
      filing_number: {type: id, source: llm, task: corporate, absence: absent_ok}
      intent: {type: label, source: gold, absence: never_absent}
      subject_matter: {type: free_text, source: gold, absence: never_absent}
      keywords: {type: "entity_list:name", source: gold, absence: never_absent}
