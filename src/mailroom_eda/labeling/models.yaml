# Approved labeling configurations. A journal record is ingested only when its
# (model, provider, reasoning, prompt_sha256, temperature) tuple also has a passing
# calibration or pilot (campaigns/<name>/approved.yaml, written by `labeling gate --approve`).
#
# Verified against the live OpenRouter catalog on `checked` (GET /api/v1/models and
# /api/v1/models/<id>/endpoints). `labeling prices` re-checks prices, context and the
# pinned providers' parameters without a key; `labeling doctor` runs it before a chunk.
#
# route (OpenRouter provider routing, sent as the request's `provider` object):
#   only           the provider slugs a request may be served by. Pinned so a calibration
#                  covers the providers that serve the chunk; fp4/mxfp4 endpoints are excluded.
#   quantizations  optional allowlist of endpoint quantizations
#   max_price      USD per 1M tokens; an endpoint above it is never used
#   seed           send `seed` (only where every pinned provider supports it; with
#                  require_parameters a provider that lacks a sent parameter is skipped)
# prompt / completion: USD per 1M tokens used for estimates and the spend gate. They are
# the most expensive pinned endpoint's price, so the gate's worst case is never low.
checked: "2026-11-06"
key_reserve_usd: 3.0
models:
  z-ai/glm-5.3-flashx-legal:
    provider: openrouter
    prompt: 0.37
    completion: 1.25
    context: 1048576
    max_completion: 131072
    roles: [legal_primary]
    reasoning_tokens: {low: {default: 300}}
    route: {only: [z-ai], max_price: {prompt: 0.37, completion: 1.25}, seed: false}
  deepseek/deepseek-v4.1-flash:
    provider: openrouter
    prompt: 0.15
    completion: 0.65
    context: 1040000
    max_completion: 393216
    roles: [general_primary, legal_second_opinion]
    # measured 2026-11-06 (p75 of real-document calls, rounded up); used by `labeling costs`
    reasoning_tokens: {low: {intent: 900, cuad: 1500, default: 1200}}
    route: {only: [deepinfra, atlas-cloud, coreweave, inference-net], quantizations: [fp8],
            max_price: {prompt: 0.15, completion: 0.65}, seed: true,
            # low (2026-11-06 real-document probes): DeepInfra spent 0 reasoning tokens on a CUAD
            # document. Run-away reasoning (over 2,300 tokens on one email) hit AtlasCloud and
            # CoreWeave alike, so it is a model trait handled by REASONING_ALLOWANCE, not a pin
            by_reasoning: {low: {only: [atlas-cloud, coreweave, inference-net]}}}
  minimax/minimax-m3.1-flash:
    provider: openrouter
    prompt: 0.15
    completion: 0.60
    context: 1048576
    max_completion: 524288
    roles: [general_second_opinion]
    reasoning_tokens: {low: {intent: 250, cuad: 1000, default: 600}}
    route: {only: [parasail, together, fireworks, sambanova], max_price: {prompt: 0.15, completion: 0.60},
            seed: false,
            # low: Parasail and Together reported 0 reasoning tokens on the 2026-11-06 ping
            by_reasoning: {low: {only: [fireworks, sambanova]}}}
  # Second-opinion bake-off candidates (2026-11-06): each must score on golden calibration
  # sets at least as well as the DeepSeek primary before it may label anything.
  deepseek/deepseek-v4.1-flash-1017:
    provider: openrouter
    prompt: 0.30
    completion: 1.20
    context: 1048576
    max_completion: 393216
    roles: [primary_candidate]
    route: {only: [deepinfra, inference-net, coreweave], quantizations: [fp8],
            max_price: {prompt: 0.30, completion: 1.20}, seed: true}
  openai/gpt-6-luna-pro:
    provider: openrouter
    prompt: 0.10
    completion: 0.50
    context: 1050000
    max_completion: 128000
    roles: [second_opinion_candidate]
    # the endpoints do not take temperature; seed is supported on both
    route: {only: [openai], max_price: {prompt: 0.10, completion: 0.50}, seed: true, temperature: false}
  anthropic/claude-haiku-5.5:
    provider: openrouter
    prompt: 0.10
    completion: 0.50
    context: 1000000
    max_completion: 128000
    roles: [second_opinion_candidate]
    # the endpoints take neither temperature nor seed
    route: {only: [anthropic, google-vertex], max_price: {prompt: 0.10, completion: 0.50},
            seed: false, temperature: false}
  Qwen/Qwen3-32B-FP8:
    provider: modal
    # Modal bills GPU time, not tokens: one H100 at about $3.95/hour. The spend cap books
    # that time (spend.Budget): first request, a cold start included, to last answer, plus
    # scaledown_seconds idle (the sandbox posture's MODAL_VLLM_SCALEDOWN_SECONDS). The token
    # prices below are only a conservative token-equivalent for dry-run projections (at
    # least 1M prompt and 0.25M output tokens per GPU-hour, which vLLM on one H100 exceeds).
    gpu_usd_per_hour: 3.95
    scaledown_seconds: 120
    # The sandbox labeler's cost model (mailroom_sandbox.gt_labeler): a cold start (32B weight
    # load + graph capture), and a conservative wall per document with 8 in flight. Dry runs
    # project GPU time from these; the run itself books the measured time.
    cold_boot_seconds: 420
    seconds_per_call: 70
    in_flight: 8
    prompt: 3.95
    completion: 15.80
    context: 32768
    roles: [fallback]
# Priced for comparison in costs.md only; not approved for ingest (model-level list price).
comparison:
  z-ai/glm-5.3-flash: {prompt: 0.15, completion: 0.50}
  qwen/qwen3.8-flash: {prompt: 0.15, completion: 0.47}
  openai/gpt-6-luna: {prompt: 0.10, completion: 0.50}
  google/gemini-3.5-flash-lite: {prompt: 0.30, completion: 2.50}
